# Local infrastructure for Requirements Studio. The API and worker run on the host: see README "Local development".
# Host ports can be moved if taken, e.g. RS_PG_PORT=5434 docker compose up -d (then update RS_DATABASE_URL);
# RS_REDIS_PORT, RS_AZURITE_PORT and RS_MAILPIT_*_PORT work the same way.
name: requirements-studio

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rs
      POSTGRES_PASSWORD: rs
      POSTGRES_DB: rs
    ports: ["${RS_PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rs -d rs"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["${RS_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Azure Blob Storage emulator (Azurite) for sources and export packages. Production uses an Azure Storage account
  # with the app's managed identity; containers are created on first use.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck --loose
    ports: ["${RS_AZURITE_PORT:-10000}:10000"]
    volumes: [azurite:/data]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the app sends (invitations, password resets, approval requests): http://localhost:8025.
  # Production uses a real SMTP relay (RS_SMTP_*).
  mailpit:
    image: axllent/mailpit:latest
    ports: ["${RS_MAILPIT_SMTP_PORT:-1025}:1025", "${RS_MAILPIT_UI_PORT:-8025}:8025"]

volumes:
  pgdata:
  azurite:
