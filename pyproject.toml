[project]
name = "requirements-studio"
version = "0.1.0"
description = "Conversational requirements and discovery tool: idea → process IR → stories, flows and exports."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8,<3",
    "jsonschema[format]>=4.23",
    "jsonpatch>=1.33",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "arq>=0.26",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    # tools/validate_samples.py
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/ir_core",
    "packages/confidence_dor",
    "packages/story_renderer",
    "packages/flow_renderer",
    "packages/exporters",
    "packages/gap_rules",
    "services",
    "apps",
]

[tool.hatch.build]
dev-mode-dirs = [".", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ir_core", "confidence_dor", "story_renderer", "flow_renderer", "exporters", "gap_rules",
                     "services", "apps", "tests"]
