<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ subject }}</title></head>
<body style="margin:0;padding:24px;background:#f8fafc;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#0f172a">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px">
    <tr><td style="padding:24px 28px 8px;font-size:13px;font-weight:600;color:#475569">Requirements Studio</td></tr>
    <tr><td style="padding:8px 28px 24px;font-size:15px;line-height:1.55">
      {% for p in paragraphs %}<p style="margin:0 0 14px">{{ p }}</p>{% endfor %}
      {% if action_url %}<p style="margin:22px 0 4px"><a href="{{ action_url }}" style="display:inline-block;background:#1d4ed8;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;font-weight:600">{{ action_label }}</a></p>{% endif %}
    </td></tr>
  </table>
</body>
</html>
