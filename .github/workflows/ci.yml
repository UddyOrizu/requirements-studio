name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rs
          POSTGRES_PASSWORD: rs
          POSTGRES_DB: rs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rs -d rs" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RS_ENV: test
      RS_OIDC_ISSUER: https://issuer.invalid/ci
      RS_DATABASE_URL: postgresql+asyncpg://rs:rs@localhost:5432/rs
      RS_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Fixtures match schemas and the reference oracle
        run: uv run python tools/validate_samples.py
      - name: Migrations apply, roll back and re-apply
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests
        run: uv run pytest -q

  web:
    # Typecheck, build and the Playwright UI tests (M12) against the real API in LLM replay mode.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rs
          POSTGRES_PASSWORD: rs
          POSTGRES_DB: rs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rs -d rs" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://rs:rs@localhost:5432/rs
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  mermaid:
    # AC-M10-4: the Mermaid flows compile with @mermaid-js/mermaid-cli.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: tools/check_mermaid.sh
